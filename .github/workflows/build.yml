name: Build APK

on:
  push:
    # "proxy-*" branches are built too, so a change can be checked before it goes to main.
    branches: [ main, 'proxy-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # If the build fails, show the first errors right on the run page.
      - name: Show build errors
        if: failure()
        run: |
          grep -E "error|What went wrong|Execution failed|AAPT" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gphotos-viewer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
