apply plugin: 'com.android.application'

android {
    namespace 'com.example.gphotosviewer'
    compileSdk 34

    defaultConfig {
        // Different id from the current app, so both can be installed
        // side by side while you compare them.
        applicationId "com.example.gphotosviewer.modern"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
